<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT Tech Toolkit</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --panel2:#f1f3f5; --text:#14181f; --muted:#646d79; --line:#e3e6ea; --line2:#d3d8de;
  --accent:#0d7a68; --accent-soft:#e2f4ef; --code-bg:#0e1319; --code-line:#1d252f; --code-text:#d5dee7; --code-comment:#6f8191;
  --var-bg:rgba(242,186,73,.16); --var-text:#f4c66a; --warn:#a15c07; --warn-soft:#fdf1dc; --danger:#b42318; --danger-soft:#fdeceb;
  --ok:#067647; --ok-soft:#ddf6e8; --info:#1d5fbf; --info-soft:#e4eefb; --purple:#6941c6; --purple-soft:#f2ebff;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06); --shadow-hover:0 4px 14px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0f14; --panel:#12171e; --panel2:#171d25; --text:#e6ecf2; --muted:#8a96a3; --line:#222a34; --line2:#2d3742;
    --accent:#3fcfa9; --accent-soft:#11302a; --code-bg:#090c10; --code-line:#1a2129; --code-text:#d5dee7; --code-comment:#66788a;
    --var-bg:rgba(242,186,73,.14); --var-text:#f4c66a; --warn:#f2a54a; --warn-soft:#2e2110; --danger:#f97066; --danger-soft:#33161a;
    --ok:#47cd89; --ok-soft:#0f2a1d; --info:#6aa8f2; --info-soft:#13233a; --purple:#b692f6; --purple-soft:#241a3b;
    --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-hover:0 6px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0b0f14; --panel:#12171e; --panel2:#171d25; --text:#e6ecf2; --muted:#8a96a3; --line:#222a34; --line2:#2d3742;
  --accent:#3fcfa9; --accent-soft:#11302a; --code-bg:#090c10; --code-line:#1a2129; --code-text:#d5dee7; --code-comment:#66788a;
  --var-bg:rgba(242,186,73,.14); --var-text:#f4c66a; --warn:#f2a54a; --warn-soft:#2e2110; --danger:#f97066; --danger-soft:#33161a;
  --ok:#47cd89; --ok-soft:#0f2a1d; --info:#6aa8f2; --info-soft:#13233a; --purple:#b692f6; --purple-soft:#241a3b;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-hover:0 6px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14.5px/1.6 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
.mono,code,pre{font-family:"Cascadia Mono","Cascadia Code","JetBrains Mono",Consolas,"Courier New",monospace}
::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}

header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:16px;padding:12px 22px}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.brand .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(140deg,#16222c,#0a0f14);color:#5ee1a0;display:grid;place-items:center;font-family:"Cascadia Mono",Consolas,monospace;font-size:13px;font-weight:700;box-shadow:inset 0 0 0 1px rgba(94,225,160,.25)}
.search{flex:1;position:relative;max-width:620px}
.search input{width:100%;padding:9px 40px 9px 36px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
.search input:focus{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 6px;color:var(--muted);background:var(--panel)}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 13px;cursor:pointer;white-space:nowrap;color:var(--muted);transition:border-color .15s,color .15s}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}

.varbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 22px 11px;border-top:1px solid var(--line)}
.varbar .lbl{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-right:4px}
.var-field{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden;transition:border-color .15s,box-shadow .15s}
.var-field:focus-within{border-color:#e0a83a;box-shadow:0 0 0 3px rgba(224,168,58,.18)}
.var-field label{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--panel2);padding:4px 9px;border-right:1px solid var(--line);align-self:stretch;display:flex;align-items:center}
.var-field input{width:140px;padding:4px 9px;border:0;background:transparent;font-family:"Cascadia Mono",Consolas,monospace;font-size:12.5px;outline:none}
.var-field.wide input{width:300px}

.labnote{display:flex;justify-content:center;align-items:center;gap:8px;background:var(--danger-soft);color:var(--danger);border-bottom:1px solid color-mix(in srgb,var(--danger) 25%,transparent);padding:7px 22px;font-size:12.5px;text-align:center}
.labnote::before{content:"!";flex:none;width:17px;height:17px;border-radius:50%;background:var(--danger);color:var(--panel);font-weight:800;font-size:11px;display:grid;place-items:center}
.labnote b{font-weight:700}

.layout{display:grid;grid-template-columns:262px 1fr;min-height:calc(100vh - var(--hh,110px))}
.card,.guide{scroll-margin-top:calc(var(--hh,110px) + 16px)}
nav{border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:var(--hh,110px);align-self:start;max-height:calc(100vh - var(--hh,110px));overflow:auto}
nav h4{margin:20px 12px 6px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
nav h4:first-child{margin-top:0}
nav button{position:relative;display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:none;padding:6px 12px;margin:1px 0;border-radius:8px;cursor:pointer;color:var(--text);transition:background .12s,color .12s}
nav button:hover{background:var(--panel2)}
nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav button.active::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--accent)}
nav .count{font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted);background:var(--panel2);border-radius:20px;padding:0 8px;min-width:24px;text-align:center}
nav button.active .count{background:var(--panel);color:var(--accent)}

main{padding:26px 32px 80px;min-width:0;max-width:1080px;width:100%}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.view-head h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.015em}
.view-head p{margin:3px 0 0;color:var(--muted)}
.legend{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow);transition:box-shadow .15s,border-color .15s}
.card:hover{box-shadow:var(--shadow-hover);border-color:var(--line2)}
.card-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:16px 18px 4px}
.card-title{font-weight:650;font-size:16px;letter-spacing:-.01em}
.card-cat{font-size:10.5px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.card-desc{padding:2px 18px 14px;color:var(--muted);max-width:78ch}
.card-desc b{color:var(--text)}
.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 9px 2px 8px;border-radius:20px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.b-admin{background:var(--warn-soft);color:var(--warn)}
.b-changes{background:var(--danger-soft);color:var(--danger)}
.b-remote{background:var(--purple-soft);color:var(--purple)}
.b-rsat{background:var(--info-soft);color:var(--info)}
.b-net{background:var(--ok-soft);color:var(--ok)}
.b-cmd{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.b-mac{background:#e8e8ed;color:#3a3a45;border:1px solid #c9c9d2}
:root[data-theme="dark"] .b-mac,:root:not([data-theme="light"]) .b-mac{background:#2b2f3a;color:#c9d2de;border-color:#3b4250}
.b-sudo{background:var(--warn-soft);color:var(--warn)}

.codewrap{position:relative;margin:0 18px;background:var(--code-bg);border:1px solid var(--code-line);border-radius:10px;overflow:hidden}
.codewrap::before{content:"";display:block;height:28px;border-bottom:1px solid var(--code-line);background:radial-gradient(circle at 16px 14px,#ff5f57 4.5px,transparent 5px),radial-gradient(circle at 32px 14px,#febc2e 4.5px,transparent 5px),radial-gradient(circle at 48px 14px,#28c840 4.5px,transparent 5px);opacity:.75}
pre{margin:0;padding:14px 18px 16px;color:var(--code-text);font-size:13px;line-height:1.7;overflow:auto;white-space:pre;tab-size:2}
pre .c{color:var(--code-comment);font-style:italic}
pre .v{background:var(--var-bg);color:var(--var-text);border-radius:4px;padding:1px 4px;box-shadow:inset 0 -1px 0 rgba(244,198,106,.45)}
.card-actions{display:flex;gap:8px;padding:12px 18px 14px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 13px;cursor:pointer;font-size:13px;font-weight:500;transition:border-color .15s,color .15s,background .15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:600}
.btn.primary:hover{filter:brightness(1.08);color:var(--panel)}
.btn.done{background:var(--ok);border-color:var(--ok);color:#fff}
.star{margin-left:auto;border:0;background:none;cursor:pointer;font-size:19px;line-height:1;color:var(--line2);padding:4px;border-radius:6px;transition:color .15s,transform .15s}
.star:hover{color:#e0a800;transform:scale(1.12)}
.star.on{color:#e0a800}

.guide{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.guide summary{list-style:none;cursor:pointer;padding:15px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center;transition:background .12s}
.guide summary:hover{background:var(--panel2)}
.guide summary::-webkit-details-marker{display:none}
.guide summary .gt{font-weight:650;font-size:15.5px;letter-spacing:-.01em}
.guide summary .gs{color:var(--muted);font-size:13px}
.guide summary .chev{transition:transform .15s;color:var(--muted)}
.guide[open] summary .chev{transform:rotate(90deg)}
.guide[open] summary{border-bottom:1px solid var(--line)}
.guide ol{margin:0;padding:16px 22px 10px 22px;list-style:none;counter-reset:step}
.guide li{position:relative;margin-bottom:12px;padding-left:36px;counter-increment:step;line-height:1.7}
.guide li::before{content:counter(step);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;display:grid;place-items:center}
.chip{display:inline-block;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);color:var(--accent);background:var(--accent-soft);border-radius:20px;padding:0 10px;font-size:12px;line-height:1.75;cursor:pointer;margin:2px 2px 0 0;font-weight:600;transition:background .12s,color .12s}
.chip:hover{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.tip{margin:0 18px 16px;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--text);border-left:3px solid var(--warn);font-size:13px}

table.runs{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.runs th,.runs td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.runs tr:last-child td{border-bottom:0}
.runs th{background:var(--panel2);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.runs td.cmd{font-family:"Cascadia Mono",Consolas,monospace;white-space:nowrap}
.runs tr:hover td{background:var(--panel2)}

.notes-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.notes-box textarea{width:100%;min-height:380px;border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--panel2);font-family:"Cascadia Mono",Consolas,monospace;font-size:13px;line-height:1.6;resize:vertical;outline:none}
.notes-box textarea:focus{border-color:var(--accent);background:var(--panel)}
.notes-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}

.section-label{margin:26px 0 12px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.empty{padding:48px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line2);border-radius:14px}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:9px 18px;border-radius:10px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;transition:.2s;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  nav{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;gap:4px;padding:8px 12px}
  nav h4{display:none}
  nav button{width:auto;white-space:nowrap;gap:6px}
  nav button.active::before{display:none}
  .brand span.name{display:none}
  .topbar,.varbar{padding-left:16px;padding-right:16px}
  .var-field input,.var-field.wide input{width:112px}
  main{padding:18px 16px 60px}
  .codewrap{margin:0 12px}
  .card-head,.card-desc,.card-actions{padding-left:14px;padding-right:14px}
}
</style>
</head>
<body>
<header>
  <div class="topbar">
    <div class="brand"><div class="logo">PS&gt;</div><span class="name">IT Tech Toolkit</span></div>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Search scripts and guides — e.g. vpn, mac, teams, printer, locked, ip" autocomplete="off">
      <kbd>/</kbd>
    </div>
    <button class="iconbtn" id="themeBtn" title="Toggle light/dark">Theme</button>
  </div>
  <div class="varbar">
    <span class="lbl">Fill-ins</span>
    <div class="var-field"><label for="v_COMPUTER">Computer</label><input id="v_COMPUTER" data-var="COMPUTER"></div>
    <div class="var-field"><label for="v_IP">IP</label><input id="v_IP" data-var="IP"></div>
    <div class="var-field"><label for="v_USER">User</label><input id="v_USER" data-var="USER"></div>
    <div class="var-field"><label for="v_PROCESS">Process</label><input id="v_PROCESS" data-var="PROCESS"></div>
    <div class="var-field"><label for="v_APP">App</label><input id="v_APP" data-var="APP"></div>
    <div class="var-field"><label for="v_DOMAIN">Domain</label><input id="v_DOMAIN" data-var="DOMAIN"></div>
    <div class="var-field wide"><label for="v_FILE">File</label><input id="v_FILE" data-var="FILE"></div>
  </div>
</header>

<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   IT TECH TOOLKIT
   Everything lives in this one file. To add a script, copy one
   of the S(...) lines below and change the text.
   Fill-ins: {{COMPUTER}} {{IP}} {{USER}} {{PROCESS}} {{APP}} {{FILE}}
   Badges: admin, changes, remote, rsat, net, cmd
   ============================================================ */

const DEFAULTS = {COMPUTER:'PC-NAME', IP:'8.8.8.8', USER:'jsmith', PROCESS:'wermgr', APP:'Chrome', DOMAIN:'corp.example.com', FILE:'C:\\Users\\Public\\Downloads\\file.exe'};

const CATS = [
  {id:'info',     name:'System info'},
  {id:'network',  name:'Network'},
  {id:'security', name:'Security & triage'},
  {id:'perf',     name:'Performance & disk'},
  {id:'print',    name:'Printing'},
  {id:'accounts', name:'Accounts & AD'},
  {id:'updates',  name:'Windows Update'},
  {id:'office',   name:'Office, Teams & OneDrive'},
  {id:'remote',   name:'Remote admin'},
  {id:'hardware', name:'Hardware & drivers'},
  {id:'logs',     name:'Event logs'},
  {id:'vpn',      name:'AWS VPN Client'},
  {id:'mac',      name:'macOS'},
  {id:'macad',    name:'macOS accounts & domain'}
];

const SCRIPTS = [];
function S(id, cat, title, badges, desc, code){ SCRIPTS.push({id, cat, title, badges, desc, code: code.replace(/^\n/, '').replace(/\s+$/, '')}); }

/* ---------------- SYSTEM INFO ---------------- */
S('sys-snapshot','info','Full system snapshot',[],
'One-shot overview: user, model, serial, OS build, CPU, RAM and uptime. Great first thing to run on any machine.',
String.raw`
$os   = Get-CimInstance Win32_OperatingSystem
$cs   = Get-CimInstance Win32_ComputerSystem
$bios = Get-CimInstance Win32_BIOS
$cpu  = Get-CimInstance Win32_Processor | Select-Object -First 1
[PSCustomObject]@{
  ComputerName = $env:COMPUTERNAME
  LoggedOnUser = $cs.UserName
  Domain       = $cs.Domain
  Manufacturer = $cs.Manufacturer
  Model        = $cs.Model
  SerialNumber = $bios.SerialNumber
  OS           = $os.Caption
  Build        = $os.BuildNumber
  CPU          = $cpu.Name
  RAM_GB       = [math]::Round($cs.TotalPhysicalMemory / 1GB, 1)
  LastBoot     = $os.LastBootUpTime
  UptimeDays   = [math]::Round(((Get-Date) - $os.LastBootUpTime).TotalDays, 1)
} | Format-List`);

S('uptime','info','How long since last reboot',[],
'Lots of "slow PC" and weird-glitch tickets are machines that have not been restarted in weeks. Note: Fast Startup means shutting down does not reset this, only Restart does.',
String.raw`
$boot = (Get-CimInstance Win32_OperatingSystem).LastBootUpTime
$up   = (Get-Date) - $boot
"Last boot: $boot"
"Uptime:    {0} days {1} hours {2} mins" -f $up.Days, $up.Hours, $up.Minutes`);

S('os-version','info','Windows version and build',[],
'Shows the edition, feature version (e.g. 23H2 / 24H2) and exact build. ProductName can still say "Windows 10" on Windows 11 machines; a build of 22000 or higher means Windows 11.',
String.raw`
Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion' |
  Select-Object ProductName, EditionID, DisplayVersion, CurrentBuild, UBR |
  Format-List`);

S('logged-on','info','Who is logged on',['cmd'],
'Shows every session on the machine, including disconnected RDP sessions that may be holding files or licences open.',
String.raw`
quser`);

S('installed-apps','info','List all installed software',[],
'Pulls from all three uninstall registry locations (64-bit, 32-bit and per-user), so it catches things Programs and Features sometimes misses.',
String.raw`
$paths = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
         'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
         'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*'
Get-ItemProperty $paths -ErrorAction SilentlyContinue |
  Where-Object DisplayName |
  Select-Object DisplayName, DisplayVersion, Publisher, InstallDate |
  Sort-Object DisplayName |
  Format-Table -AutoSize`);

S('find-app','info','Is a specific app installed? (uses App)',[],
'Searches installed software for the name in the <b>App</b> fill-in box and shows version and uninstall string.',
String.raw`
$name  = '{{APP}}'
$paths = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
         'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
         'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*'
Get-ItemProperty $paths -ErrorAction SilentlyContinue |
  Where-Object { $_.DisplayName -like "*$name*" } |
  Select-Object DisplayName, DisplayVersion, Publisher, InstallDate, UninstallString |
  Format-List`);

S('reboot-history','info','Recent shutdowns, restarts and crashes',[],
'Event 1074 = someone or something restarted it (shows who/what). 6008 = unexpected shutdown. 41 = lost power or hard crash.',
String.raw`
Get-WinEvent -FilterHashtable @{ LogName='System'; Id=1074,6008,41 } -MaxEvents 20 -ErrorAction SilentlyContinue |
  Select-Object TimeCreated, Id, @{n='Message';e={ ($_.Message -split "\r?\n")[0] }} |
  Format-Table -AutoSize -Wrap`);

/* ---------------- NETWORK ---------------- */
S('net-overview','network','Network adapters, IPs, gateway and DNS',[],
'Quick view of every connected adapter with its IP, default gateway and DNS servers. A 169.254.x.x address means DHCP failed.',
String.raw`
Get-NetIPConfiguration | Where-Object { $_.NetAdapter.Status -eq 'Up' } | ForEach-Object {
  [PSCustomObject]@{
    Adapter = $_.InterfaceAlias
    IPv4    = ($_.IPv4Address.IPAddress -join ', ')
    Gateway = ($_.IPv4DefaultGateway.NextHop -join ', ')
    DNS     = ($_.DNSServer | Where-Object AddressFamily -eq 2 | ForEach-Object ServerAddresses) -join ', '
  }
} | Format-Table -AutoSize`);

S('public-ip','network','What is my public IP?',['net'],
'Shows the public IP this machine is coming out from, plus the ISP and location. Handy for checking if the VPN is actually in use.',
String.raw`
Invoke-RestMethod "https://ipinfo.io/json"`);

S('ip-lookup','network','Who owns this IP? (uses IP)',['net'],
'Your favourite. Looks up the IP in the <b>IP</b> fill-in box. The <b>org</b> field tells you who owns it. If the corporate proxy blocks it, paste the IP into ipinfo.io, AbuseIPDB or VirusTotal in a browser instead.',
String.raw`
Invoke-RestMethod "https://ipinfo.io/{{IP}}/json"`);

S('conn-owners','network','Every live connection with its owner (IP lookup on steroids)',['net'],
'Takes every established outbound connection, skips private/internal addresses, and looks each public IP up on ipinfo.io. You get process name, PID, remote IP and who owns it in one table. Good for spotting something talking to a host it has no business talking to.',
String.raw`
$private = '^(10\.|127\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|169\.254\.|0\.0\.0\.0|::|fe80)'
$cache   = @{}
Get-NetTCPConnection -State Established |
  Where-Object { $_.RemoteAddress -notmatch $private } |
  ForEach-Object {
    $ip = $_.RemoteAddress
    if (-not $cache.ContainsKey($ip)) {
      try   { $cache[$ip] = Invoke-RestMethod "https://ipinfo.io/$ip/json" -TimeoutSec 5 }
      catch { $cache[$ip] = [PSCustomObject]@{ org = 'lookup failed'; country = '' } }
      Start-Sleep -Milliseconds 200
    }
    [PSCustomObject]@{
      Process  = (Get-Process -Id $_.OwningProcess -ErrorAction SilentlyContinue).ProcessName
      PID      = $_.OwningProcess
      RemoteIP = $ip
      Port     = $_.RemotePort
      Owner    = $cache[$ip].org
      Country  = $cache[$ip].country
    }
  } | Sort-Object Process | Format-Table -AutoSize`);

S('test-port','network','Can I reach a host on a port? (uses Computer)',['net'],
'Tests ping and a TCP port to the host in the <b>Computer</b> box. TcpTestSucceeded True means the port is open and reachable. Change 443 to 3389 (RDP), 445 (file shares), 5985 (WinRM) etc.',
String.raw`
Test-NetConnection {{COMPUTER}} -Port 443`);

S('traceroute','network','Trace the route to a host (uses Computer)',['net'],
'Shows each hop between here and the target. Where the hops stop replying is roughly where the problem is.',
String.raw`
Test-NetConnection {{COMPUTER}} -TraceRoute`);

S('dns-lookup','network','DNS lookup (uses Computer)',['net'],
'Checks what the name resolves to. If it resolves to the wrong IP or not at all, it is a DNS problem, not a network one.',
String.raw`
Resolve-DnsName {{COMPUTER}}
# Compare against a specific DNS server:
# Resolve-DnsName {{COMPUTER}} -Server 8.8.8.8`);

S('flush-dns','network','Flush the DNS cache',['changes'],
'Safe and instant. Fixes websites or servers that have moved to a new IP but the PC still remembers the old one.',
String.raw`
Clear-DnsClientCache
ipconfig /flushdns
Write-Host 'DNS cache cleared.'`);

S('net-reset','network','Full network stack reset',['admin','changes'],
'The big hammer for "no internet" when everything else looks fine. Releases/renews the IP, flushes DNS and resets Winsock and TCP/IP. <b>A reboot is required afterwards</b> and the connection will drop, so do not run this over a remote session.',
String.raw`
ipconfig /release
ipconfig /renew
ipconfig /flushdns
netsh winsock reset
netsh int ip reset
Write-Host 'Done. Restart the PC now.' -ForegroundColor Yellow`);

S('wifi-info','network','Wi-Fi signal and connection details',['cmd'],
'Shows the SSID, signal strength, band, channel and link speed. Signal below about 60% explains a lot of dropouts and slow Teams calls.',
String.raw`
netsh wlan show interfaces`);

S('wifi-key','network','Show saved Wi-Fi networks and a password',['admin','cmd'],
'Lists saved Wi-Fi profiles. Replace NETWORKNAME in the second line with one of them to see its saved password (Key Content).',
String.raw`
netsh wlan show profiles
netsh wlan show profile name="NETWORKNAME" key=clear`);

S('listening-ports','network','What is listening on this machine?',[],
'Every open listening port and the process behind it. Anything unexpected listening (especially on 0.0.0.0) is worth a closer look.',
String.raw`
Get-NetTCPConnection -State Listen |
  Select-Object LocalAddress, LocalPort, OwningProcess,
    @{n='Process';e={ (Get-Process -Id $_.OwningProcess -ErrorAction SilentlyContinue).ProcessName }} |
  Sort-Object LocalPort |
  Format-Table -AutoSize`);

S('proxy-check','network','Check proxy settings',[],
'Shows both the system (WinHTTP) proxy and the user proxy. A stale proxy setting is a classic cause of "internet works in one app but not another".',
String.raw`
netsh winhttp show proxy
Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings' |
  Select-Object ProxyEnable, ProxyServer, ProxyOverride, AutoConfigURL |
  Format-List`);

S('mapped-drives','network','List mapped drives',[],
'Shows mapped network drives and where they point. Run as the user (not elevated), because admin sessions do not see the user\'s mappings.',
String.raw`
Get-PSDrive -PSProvider FileSystem | Where-Object DisplayRoot |
  Select-Object Name, DisplayRoot, @{n='FreeGB';e={ [math]::Round($_.Free/1GB,1) }} |
  Format-Table -AutoSize
net use`);

S('map-drive','network','Map a network drive',['changes'],
'Edit the letter and path first. Run as the user, not as admin. Persistent means it comes back after a reboot.',
String.raw`
net use Z: \\server\share /persistent:yes
# Remove it again:
# net use Z: /delete`);

/* ---------------- SECURITY & TRIAGE ---------------- */
S('proc-inspect','security','Inspect a process: path, signature, parent (uses Process)',[],
'The triage check from our wermgr / agentsvc work. Put the process name in the <b>Process</b> box. Red flags: path outside System32 or Program Files (e.g. AppData, Temp, ProgramData), signature not Valid, odd parent (Office app, cmd, powershell, rundll32), strange command line.',
String.raw`
$name = '{{PROCESS}}'
Get-CimInstance Win32_Process -Filter "Name LIKE '$name%'" | ForEach-Object {
  $parent = Get-CimInstance Win32_Process -Filter "ProcessId=$($_.ParentProcessId)" -ErrorAction SilentlyContinue
  $sig    = if ($_.ExecutablePath) { Get-AuthenticodeSignature $_.ExecutablePath } else { $null }
  [PSCustomObject]@{
    Name        = $_.Name
    PID         = $_.ProcessId
    Path        = $_.ExecutablePath
    CommandLine = $_.CommandLine
    Parent      = if ($parent) { "$($parent.Name) ($($_.ParentProcessId))" } else { "exited ($($_.ParentProcessId))" }
    Signature   = if ($sig) { $sig.Status } else { 'n/a (run as admin?)' }
    SignedBy    = if ($sig -and $sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { '' }
    Started     = $_.CreationDate
  }
} | Format-List`);

S('unsigned-procs','security','Running processes that are not validly signed',['admin'],
'Checks the digital signature of every running program. Unsigned is not automatically bad (some in-house or small-vendor tools are unsigned) but it is where to start looking.',
String.raw`
Get-Process | Where-Object Path | Sort-Object Path -Unique | ForEach-Object {
  $sig = Get-AuthenticodeSignature $_.Path
  if ($sig.Status -ne 'Valid') {
    [PSCustomObject]@{ Name = $_.ProcessName; PID = $_.Id; Status = $sig.Status; Path = $_.Path }
  }
} | Format-Table -AutoSize`);

S('procs-userpaths','security','Processes running from user-writable folders',[],
'Malware loves AppData, Temp, ProgramData and Public. Some legit apps (Teams, Zoom, Spotify, Chrome updaters) also live in AppData, so check each one.',
String.raw`
Get-Process | Where-Object { $_.Path -match '\\AppData\\|\\Temp\\|\\ProgramData\\|\\Users\\Public\\' } |
  Select-Object ProcessName, Id, Path |
  Sort-Object Path |
  Format-Table -AutoSize`);

S('sched-tasks','security','Non-Microsoft scheduled tasks',[],
'Scheduled tasks are a favourite persistence trick. This hides the built-in Microsoft ones and shows what each remaining task actually runs.',
String.raw`
Get-ScheduledTask | Where-Object { $_.TaskPath -notlike '\Microsoft\*' } | ForEach-Object {
  [PSCustomObject]@{
    Task   = $_.TaskPath + $_.TaskName
    State  = $_.State
    Author = $_.Author
    Runs   = ($_.Actions | ForEach-Object { "$($_.Execute) $($_.Arguments)" }) -join '; '
  }
} | Format-Table -AutoSize -Wrap`);

S('startup-items','security','Startup programs and Run keys',[],
'Everything set to launch at logon. Useful both for security (persistence) and for slow logons.',
String.raw`
Get-CimInstance Win32_StartupCommand |
  Select-Object Name, Command, Location, User |
  Format-Table -AutoSize -Wrap`);

S('local-admins','security','Who is a local administrator?',[],
'Lists members of the local Administrators group. If the first command errors (it can with orphaned accounts), the second always works.',
String.raw`
Get-LocalGroupMember -Group Administrators | Select-Object Name, ObjectClass, PrincipalSource
net localgroup administrators`);

S('failed-logons','security','Failed logons in the last 24 hours',['admin'],
'Event 4625. Logon type 2 = at the keyboard, 3 = network, 10 = RDP. Lots of failures from one source IP = password spraying or a device with an old saved password.',
String.raw`
Get-WinEvent -FilterHashtable @{ LogName='Security'; Id=4625; StartTime=(Get-Date).AddHours(-24) } -ErrorAction SilentlyContinue |
  ForEach-Object {
    $x = [xml]$_.ToXml(); $d = @{}
    $x.Event.EventData.Data | ForEach-Object { $d[$_.Name] = $_.'#text' }
    [PSCustomObject]@{
      Time        = $_.TimeCreated
      User        = $d['TargetUserName']
      Domain      = $d['TargetDomainName']
      LogonType   = $d['LogonType']
      SourceIP    = $d['IpAddress']
      Workstation = $d['WorkstationName']
    }
  } | Format-Table -AutoSize`);

S('success-logons','security','Interactive and RDP logons (last 7 days)',['admin'],
'Event 4624 filtered to real people: type 2 (keyboard), 10 (RDP) and 11 (cached). Shows who actually sat at or remoted into this machine.',
String.raw`
Get-WinEvent -FilterHashtable @{ LogName='Security'; Id=4624; StartTime=(Get-Date).AddDays(-7) } -ErrorAction SilentlyContinue |
  ForEach-Object {
    $x = [xml]$_.ToXml(); $d = @{}
    $x.Event.EventData.Data | ForEach-Object { $d[$_.Name] = $_.'#text' }
    if ($d['LogonType'] -in '2','10','11') {
      [PSCustomObject]@{
        Time      = $_.TimeCreated
        User      = "$($d['TargetDomainName'])\$($d['TargetUserName'])"
        LogonType = $d['LogonType']
        SourceIP  = $d['IpAddress']
      }
    }
  } | Format-Table -AutoSize`);

S('rdp-logons','security','Remote Desktop session history',[],
'Event 21 = session logon, 24 = disconnected, 25 = reconnected. Includes the source address the connection came from.',
String.raw`
Get-WinEvent -LogName 'Microsoft-Windows-TerminalServices-LocalSessionManager/Operational' -MaxEvents 50 -ErrorAction SilentlyContinue |
  Where-Object Id -in 21,24,25 |
  Select-Object TimeCreated, Id, @{n='Detail';e={ ($_.Message -split "\r?\n" | Where-Object { $_ -match 'User:|Source Network Address:' }) -join ' | ' }} |
  Format-Table -AutoSize -Wrap`);

S('defender-status','security','Defender status and recent detections',[],
'Is real-time protection on, are signatures current, when was the last scan, and has anything been caught. If AMRunningMode says Passive, another AV/EDR is the primary.',
String.raw`
Get-MpComputerStatus |
  Select-Object AMRunningMode, AntivirusEnabled, RealTimeProtectionEnabled, AntivirusSignatureLastUpdated, QuickScanEndTime, FullScanEndTime |
  Format-List
Get-MpThreatDetection | Select-Object InitialDetectionTime, ProcessName, @{n='Resources';e={ $_.Resources -join '; ' }}, ActionSuccess |
  Format-Table -AutoSize -Wrap`);

S('defender-scan','security','Update Defender and run a quick scan',['admin','changes'],
'Pulls the latest signatures first, then runs a quick scan. Takes a few minutes.',
String.raw`
Update-MpSignature
Start-MpScan -ScanType QuickScan
Get-MpThreatDetection | Select-Object InitialDetectionTime, ProcessName, ActionSuccess`);

S('file-hash','security','Hash a file and open it in VirusTotal (uses File)',['net'],
'Gets the SHA256 of the file in the <b>File</b> box and opens its VirusTotal page. Only the hash is sent, not the file, so it is safe for confidential stuff.',
String.raw`
$hash = (Get-FileHash '{{FILE}}' -Algorithm SHA256).Hash
$hash
Start-Process "https://www.virustotal.com/gui/file/$hash"`);

S('file-sig','security','Check a file\'s digital signature (uses File)',[],
'Status should be Valid and the Subject should be the company you expect.',
String.raw`
Get-AuthenticodeSignature '{{FILE}}' |
  Select-Object Status, StatusMessage, @{n='SignedBy';e={ $_.SignerCertificate.Subject }} |
  Format-List`);

S('new-exes','security','New executables and scripts in the last 7 days',[],
'Looks in Downloads, AppData, Temp and ProgramData for new .exe/.dll/.ps1/.bat/.vbs/.js/.hta files. Run it as the affected user (not elevated as a different account) so it checks their profile.',
String.raw`
$since = (Get-Date).AddDays(-7)
Get-ChildItem -Path "$env:USERPROFILE\Downloads", "$env:USERPROFILE\AppData", $env:TEMP, 'C:\ProgramData' -Recurse -File -Include *.exe,*.dll,*.ps1,*.bat,*.vbs,*.js,*.hta -ErrorAction SilentlyContinue |
  Where-Object { $_.CreationTime -gt $since } |
  Select-Object CreationTime, @{n='KB';e={ [math]::Round($_.Length/1KB) }}, FullName |
  Sort-Object CreationTime -Descending |
  Format-Table -AutoSize`);

S('ps-history','security','PowerShell history for a user (uses User)',['admin'],
'The last 50 commands typed into PowerShell by the user in the <b>User</b> box. Very handy in an investigation.',
String.raw`
Get-Content 'C:\Users\{{USER}}\AppData\Roaming\Microsoft\Windows\PowerShell\PSReadLine\ConsoleHost_history.txt' -Tail 50`);

S('hosts-check','security','Check the hosts file for tampering',[],
'Shows any active (non-comment) entries. A clean hosts file normally has none. Entries pointing banking or Microsoft sites somewhere else are a big red flag.',
String.raw`
Get-Content "$env:SystemRoot\System32\drivers\etc\hosts" |
  Where-Object { $_.Trim() -and $_ -notmatch '^\s*#' }`);

S('dns-cache','security','What has this PC been resolving? (DNS cache)',[],
'Recent DNS lookups. Good for spotting odd domains without needing a proxy log.',
String.raw`
Get-DnsClientCache | Select-Object Entry, Data | Sort-Object Entry -Unique | Format-Table -AutoSize`);

S('firewall-status','security','Firewall status',[],
'All three profiles (Domain, Private, Public) should normally be Enabled.',
String.raw`
Get-NetFirewallProfile | Select-Object Name, Enabled, DefaultInboundAction, DefaultOutboundAction | Format-Table -AutoSize`);

S('bitlocker','security','BitLocker status and recovery key',['admin'],
'Shows whether the drive is encrypted and lists the protectors. The Numerical Password entry is the 48-digit recovery key. Treat it like a password.',
String.raw`
manage-bde -status C:
manage-bde -protectors -get C:`);

/* ---------------- PERFORMANCE & DISK ---------------- */
S('top-cpu','perf','Top 10 processes by CPU right now',[],
'A live sample of CPU use, adjusted for the number of cores so the figures are real percentages.',
String.raw`
(Get-Counter '\Process(*)\% Processor Time' -ErrorAction SilentlyContinue).CounterSamples |
  Where-Object { $_.InstanceName -notin '_total','idle' } |
  Sort-Object CookedValue -Descending |
  Select-Object -First 10 InstanceName, @{n='CPU%';e={ [math]::Round($_.CookedValue / $env:NUMBER_OF_PROCESSORS, 1) }} |
  Format-Table -AutoSize`);

S('top-mem','perf','Top 10 processes by memory',[],
'Which apps are eating RAM. Browsers with dozens of tabs and Teams are the usual suspects.',
String.raw`
Get-Process | Sort-Object WorkingSet64 -Descending | Select-Object -First 10 Name, Id,
  @{n='MemoryMB';e={ [math]::Round($_.WorkingSet64 / 1MB) }} |
  Format-Table -AutoSize
$os = Get-CimInstance Win32_OperatingSystem
"Memory in use: {0}%" -f [math]::Round((1 - $os.FreePhysicalMemory / $os.TotalVisibleMemorySize) * 100)`);

S('disk-space','perf','Disk space on all drives',[],
'Under 10% free on C: will slow Windows down and break updates.',
String.raw`
Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" |
  Select-Object DeviceID,
    @{n='SizeGB';e={ [math]::Round($_.Size/1GB,1) }},
    @{n='FreeGB';e={ [math]::Round($_.FreeSpace/1GB,1) }},
    @{n='Free%'; e={ [math]::Round($_.FreeSpace/$_.Size*100) }} |
  Format-Table -AutoSize`);

S('clear-temp','perf','Clear temp folders',['admin','changes'],
'Empties the user and Windows temp folders and tells you how much was freed. Files in use are skipped automatically, so it is safe.',
String.raw`
$targets = "$env:TEMP", "$env:SystemRoot\Temp"
$before  = ($targets | ForEach-Object { Get-ChildItem $_ -Recurse -File -Force -ErrorAction SilentlyContinue } | Measure-Object Length -Sum).Sum
foreach ($t in $targets) { Get-ChildItem $t -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue }
$after   = ($targets | ForEach-Object { Get-ChildItem $_ -Recurse -File -Force -ErrorAction SilentlyContinue } | Measure-Object Length -Sum).Sum
"Freed about {0} MB" -f [math]::Round(($before - $after) / 1MB)`);

S('big-folders','perf','Biggest folders in a user profile (uses User)',[],
'Finds what is eating a user\'s space. Usually Downloads, Desktop, an old OST or a OneDrive folder with Files On-Demand turned off.',
String.raw`
$root = 'C:\Users\{{USER}}'
Get-ChildItem $root -Directory -Force -ErrorAction SilentlyContinue | ForEach-Object {
  $size = (Get-ChildItem $_.FullName -Recurse -File -Force -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
  [PSCustomObject]@{ Folder = $_.Name; SizeGB = [math]::Round($size / 1GB, 2) }
} | Sort-Object SizeGB -Descending | Format-Table -AutoSize`);

S('big-files','perf','Files over 1 GB on C:',['admin'],
'Takes a minute or two. Finds ISOs, old backups, videos and forgotten VM disks.',
String.raw`
Get-ChildItem C:\ -Recurse -File -Force -ErrorAction SilentlyContinue |
  Where-Object { $_.Length -gt 1GB } |
  Select-Object @{n='SizeGB';e={ [math]::Round($_.Length/1GB,2) }}, LastWriteTime, FullName |
  Sort-Object SizeGB -Descending |
  Format-Table -AutoSize`);

S('sfc-dism','perf','Repair Windows system files (DISM + SFC)',['admin','changes'],
'Fixes corrupted Windows files. Run DISM first (it repairs the store SFC uses), then SFC. Takes 10 to 30 minutes. Reboot afterwards.',
String.raw`
DISM /Online /Cleanup-Image /RestoreHealth
sfc /scannow`);

S('restart-explorer','perf','Restart Explorer (frozen taskbar or Start menu)',['changes'],
'Fixes a stuck taskbar, Start menu or desktop without a reboot. The screen flickers for a second.',
String.raw`
Stop-Process -Name explorer -Force
Start-Sleep 2
if (-not (Get-Process explorer -ErrorAction SilentlyContinue)) { Start-Process explorer.exe }`);

S('disk-health','perf','Disk health (SSD / HDD)',[],
'HealthStatus should be Healthy. Anything else means back up now and replace the drive. MediaType HDD in a slow machine is often the whole problem.',
String.raw`
Get-PhysicalDisk |
  Select-Object FriendlyName, MediaType, HealthStatus, OperationalStatus, @{n='SizeGB';e={ [math]::Round($_.Size/1GB) }} |
  Format-Table -AutoSize`);

S('power-plan','perf','Check and switch power plan',['changes'],
'Laptops stuck on Power Saver are slow. The second line switches to High Performance (may be hidden on some laptops that use Balanced + power mode slider instead).',
String.raw`
powercfg /list
powercfg /setactive SCHEME_MIN`);

/* ---------------- PRINTING ---------------- */
S('list-printers','print','List installed printers',[],
'Shows each printer, its driver, port and status, and which one is the default.',
String.raw`
Get-CimInstance Win32_Printer |
  Select-Object Name, Default, PrinterStatus, DriverName, PortName |
  Format-Table -AutoSize`);

S('clear-spooler','print','Restart spooler and clear stuck jobs',['admin','changes'],
'The number-one printer fix. Stops the spooler, deletes all stuck jobs, and starts it again. This clears jobs for every printer on the machine.',
String.raw`
Stop-Service Spooler -Force
Remove-Item "$env:SystemRoot\System32\spool\PRINTERS\*" -Force -ErrorAction SilentlyContinue
Start-Service Spooler
Get-Service Spooler`);

S('print-jobs','print','Show print queue for every printer',[],
'See what is waiting and whether a single job is in Error and blocking the rest.',
String.raw`
Get-Printer | ForEach-Object { Get-PrintJob -PrinterName $_.Name -ErrorAction SilentlyContinue } |
  Select-Object PrinterName, Id, DocumentName, UserName, JobStatus, SubmittedTime |
  Format-Table -AutoSize`);

S('add-printer','print','Add a shared network printer',['changes'],
'Edit the print server and printer name. Run as the user so it lands in their profile.',
String.raw`
Add-Printer -ConnectionName '\\printserver\PrinterName'`);

S('default-printer','print','Stop Windows changing the default printer, then set it',['changes'],
'Windows likes to make the last-used printer the default. The first line turns that off; edit the name in the second part to set the default.',
String.raw`
Set-ItemProperty 'HKCU:\Software\Microsoft\Windows NT\CurrentVersion\Windows' -Name LegacyDefaultPrinterMode -Value 1
Get-CimInstance Win32_Printer -Filter "Name='Printer Name Here'" | Invoke-CimMethod -MethodName SetDefaultPrinter`);

S('test-page','print','Send a test page',[],
'Edit the printer name. Tells you if the problem is the printer or the app.',
String.raw`
Get-CimInstance Win32_Printer -Filter "Name='Printer Name Here'" | Invoke-CimMethod -MethodName PrintTestPage`);

/* ---------------- ACCOUNTS & AD ---------------- */
S('whoami','accounts','Who am I, and what groups am I in?',['cmd'],
'Confirms the account, UPN and group memberships of the current session. Handy when "access denied" might just be a missing group.',
String.raw`
whoami /upn
whoami /groups /fo table`);

S('gpupdate','accounts','Force a Group Policy refresh',['changes','cmd'],
'Pulls down the latest policies, drive maps and printers. Needs line of sight to a domain controller (office network or VPN).',
String.raw`
gpupdate /force`);

S('gpresult','accounts','Group Policy report',['cmd'],
'The first line gives a quick text summary. The second builds a full HTML report on the desktop and opens it.',
String.raw`
gpresult /r
gpresult /h "$env:USERPROFILE\Desktop\gpresult.html" /f
Start-Process "$env:USERPROFILE\Desktop\gpresult.html"`);

S('secure-channel','accounts','Check / repair domain trust',['admin'],
'For "The trust relationship between this workstation and the primary domain failed". True = healthy. The repair line asks for domain admin credentials and fixes it without rejoining.',
String.raw`
Test-ComputerSecureChannel -Verbose
# If False, repair it:
# Test-ComputerSecureChannel -Repair -Credential (Get-Credential)`);

S('ad-user','accounts','AD account status: locked, expired, last logon (uses User)',['rsat'],
'Everything you need for "I can\'t log in" in one go. Needs the RSAT Active Directory module.',
String.raw`
Get-ADUser {{USER}} -Properties LockedOut, Enabled, PasswordLastSet, PasswordExpired, LastLogonDate, BadLogonCount, 'msDS-UserPasswordExpiryTimeComputed' |
  Select-Object Name, SamAccountName, Enabled, LockedOut, PasswordExpired, PasswordLastSet, LastLogonDate, BadLogonCount,
    @{n='PasswordExpires';e={ [datetime]::FromFileTime($_.'msDS-UserPasswordExpiryTimeComputed') }} |
  Format-List`);

S('ad-unlock','accounts','Unlock an AD account (uses User)',['rsat','changes'],
'Unlocks straight away. If it locks again within minutes, find the source with the lockout script before unlocking again.',
String.raw`
Unlock-ADAccount {{USER}}
Get-ADUser {{USER}} -Properties LockedOut | Select-Object SamAccountName, LockedOut`);

S('net-user','accounts','Account status without RSAT (uses User)',['cmd'],
'Works on any domain-joined PC. Look at "Account active", "Password expires" and "Last logon".',
String.raw`
net user {{USER}} /domain`);

S('lockout-source','accounts','Find what keeps locking an account (uses User)',['rsat','admin'],
'Reads lockout events (4740) on the PDC emulator and shows which machine caused the lockout. Usually a phone with an old password, a mapped drive with saved creds, or a disconnected RDP session.',
String.raw`
$pdc = (Get-ADDomain).PDCEmulator
Get-WinEvent -ComputerName $pdc -FilterHashtable @{ LogName='Security'; Id=4740 } -MaxEvents 200 -ErrorAction SilentlyContinue |
  Where-Object { $_.Properties[0].Value -eq '{{USER}}' } |
  Select-Object TimeCreated, @{n='User';e={ $_.Properties[0].Value }}, @{n='LockedFrom';e={ $_.Properties[1].Value }} |
  Format-Table -AutoSize`);

S('ad-groups','accounts','A user\'s AD groups (uses User)',['rsat'],
'Compare against a colleague who can access the thing this user can\'t.',
String.raw`
Get-ADPrincipalGroupMembership {{USER}} | Select-Object Name | Sort-Object Name`);

S('dsreg','accounts','Entra ID (Azure AD) join and SSO status',['cmd'],
'Check AzureAdJoined / DomainJoined, and AzureAdPrt = YES. If AzureAdPrt is NO, single sign-on to Office and Teams will keep prompting for passwords.',
String.raw`
dsregcmd /status`);

S('cred-list','accounts','List saved credentials (Credential Manager)',['cmd'],

  if (Test-Path "$cfg\ConnectionProfiles") { Write-Host "--- ConnectionProfiles ---" -ForegroundColor Cyan; Get-Content "$cfg\ConnectionProfiles" }

S('vpn-clean-reinstall-win','vpn','Clean wipe and reinstall of the AWS VPN Client (Windows)',['admin','changes'],
'The all-in-one: backs up profiles, closes the client, uninstalls whichever version is installed (it looks the product code up itself), deletes every leftover folder, then installs the new MSI silently and optionally puts the profiles back. <b>Edit the first two lines before running.</b> Download the MSI first from the AWS Client VPN download page.',
String.raw`
# ---- SETTINGS -------------------------------------------------------------
$installer      = 'C:\Temp\AWS_VPN_Client.msi'   # downloaded MSI, or '' to uninstall only
$restoreProfiles = $true                          # put the user's profiles back afterwards
# ---------------------------------------------------------------------------

$cfg    = "$env:USERPROFILE\.config\AWSVPNClient"
$backup = "$env:USERPROFILE\Desktop\AWSVPNClient-backup-" + (Get-Date -Format 'yyyyMMdd-HHmm')

Write-Host '1. Backing up profiles...' -ForegroundColor Cyan
if (Test-Path $cfg) { Copy-Item $cfg $backup -Recurse -Force; Write-Host "   saved to $backup" }
else { Write-Host '   no existing profile folder'; $restoreProfiles = $false }

Write-Host '2. Closing the client...' -ForegroundColor Cyan
Get-Process | Where-Object { $_.Name -match 'AWS VPN Client|awsvpnclient|openvpn' } | Stop-Process -Force -ErrorAction SilentlyContinue
Get-Service | Where-Object { $_.DisplayName -like '*AWS VPN*' } | Stop-Service -Force -ErrorAction SilentlyContinue
Start-Sleep 3

Write-Host '3. Uninstalling...' -ForegroundColor Cyan
$paths = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
         'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
$found = Get-ItemProperty $paths -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like '*AWS VPN Client*' }
if ($found) {
  foreach ($app in $found) {
    Write-Host "   removing $($app.DisplayName) $($app.DisplayVersion)"
    Start-Process msiexec.exe -ArgumentList ('/x ' + $app.PSChildName + ' /qn /norestart') -Wait
  }
} else { Write-Host '   nothing installed to remove' }

Write-Host '4. Deleting leftovers...' -ForegroundColor Cyan
$leftovers = "$env:ProgramFiles\Amazon\AWS VPN Client",
             ([Environment]::GetFolderPath('ProgramFilesX86') + '\Amazon\AWS VPN Client'),
             "$env:ProgramData\Amazon\AWSVPNClient",
             "$env:APPDATA\AWSVPNClient",
             "$env:LOCALAPPDATA\AWSVPNClient",
             $cfg
foreach ($p in $leftovers) {
  if (Test-Path $p) { Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue; Write-Host "   removed $p" }
}

Write-Host '5. Installing...' -ForegroundColor Cyan
if ($installer -and (Test-Path $installer)) {
  $log = "$env:TEMP\AWS_VPN_Client-install.log"
  Start-Process msiexec.exe -ArgumentList ('/i "' + $installer + '" /qn /norestart /L*v "' + $log + '"') -Wait
  Write-Host "   installed. MSI log: $log"
} else { Write-Host '   no installer path set, skipping install' -ForegroundColor Yellow }

if ($restoreProfiles -and (Test-Path $backup)) {
  Write-Host '6. Restoring profiles...' -ForegroundColor Cyan
  Copy-Item $backup $cfg -Recurse -Force
  Write-Host '   restored. If the client still shows no profiles, re-import the .ovpn by hand.'
}
Write-Host ""; Write-Host "Done. Reboot, then launch the client and test the connection." -ForegroundColor Green`);
